<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FROST MC | Minecraft Server</title>
<meta name="description" content="FROST MC — Minecraft Java + Bedrock server. Snow Valley, Survival, Economy, Events & Community.">
<meta name="theme-color" content="#07040f">
<meta property="og:title" content="FROST MC">
<meta property="og:description" content="Minecraft Java + Bedrock server — Purple × Black 💜">
<meta property="og:image" content="assets/banner-hero.jpg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Entry gate (also unlocks music autoplay) ===== -->
<div id="gate">
  <div class="gate-bg"></div>
  <div class="gate-box">
    <img src="assets/logo.jpg" alt="FROST MC" class="gate-logo">
    <div class="gate-load"><i id="gateBar"></i></div>
    <button id="gateBtn" class="btn btn-primary btn-lg" disabled>
      <span data-i18n="gate_loading">جاري التحميل...</span>
    </button>
    <p class="gate-note" data-i18n="gate_note">الموقع فيه موسيقى 🎵 تقدر توقفها في أي وقت</p>
    <button id="gateLang" class="link-btn">English / العربية</button>
  </div>
</div>

<canvas id="snow" aria-hidden="true"></canvas>
<div id="cursorGlow" aria-hidden="true"></div>
<div id="progress"></div>

<!-- ===== Sidebar ===== -->
<aside id="sidebar" aria-label="Navigation">
  <a href="#/home" class="side-brand">
    <img src="assets/logo.jpg" alt="FROST MC" id="sideLogo">
    <span class="brand-name">FROST <b>MC</b></span>
  </a>
  <nav id="nav"></nav>
  <div class="side-foot">
    <a class="btn btn-discord btn-block" id="sideDiscord" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-4.4 0L10.6 3a19.7 19.7 0 0 0-4.9 1.4C2.6 9 1.8 13.5 2.2 18a19.9 19.9 0 0 0 6 3l.8-1.3-1.3-.6.3-.3a14.2 14.2 0 0 0 12 0l.3.3-1.3.6.8 1.3a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.6ZM8.7 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm6.6 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>
      <span data-i18n="discord">DISCORD</span>
    </a>
    <small class="copy">© <span id="year"></span> FROST MC</small>
  </div>
</aside>
<div id="overlay"></div>

<!-- ===== Main ===== -->
<div id="main">
  <header id="topbar">
    <button id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    <a href="#/home" class="top-brand"><img src="assets/favicon.png" alt=""><b>FROST MC</b></a>
    <div class="top-spacer"></div>
    <div class="status-pill" id="statusPill" title="Server status">
      <i class="st-dot"></i><span class="st-text">...</span>
    </div>
    <div class="vol-wrap">
      <input type="range" id="vol" min="0" max="100" value="60" aria-label="Volume">
    </div>
    <button id="musicBtn" class="icon-btn" aria-label="Music" title="Music">
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </button>
    <button id="langBtn" class="icon-btn lang-btn" aria-label="Language">EN</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer id="footer">
    <img src="assets/logo.jpg" alt="" class="foot-logo">
    <div>
      <b>FROST MC</b>
      <p data-i18n="foot_text">Purple × Black 💜 — Java + Bedrock</p>
      <p class="muted small" data-i18n="foot_disclaimer">FROST MC ليس تابعاً لـ Mojang أو Microsoft.</p>
    </div>
    <div class="foot-links">
      <a id="footDiscord" target="_blank" rel="noopener">Discord</a>
      <a href="#/rules" data-i18n="nav_rules">القوانين</a>
      <a href="#/admin" data-i18n="nav_admin">لوحة الإدارة</a>
    </div>
  </footer>
</div>

<!-- ===== Modal ===== -->
<div id="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-x" id="modalX" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<button id="toTop" aria-label="Top">↑</button>
<div id="yt-wrap" aria-hidden="true"><div id="yt-player"></div></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/effects.js"></script>
<script src="js/music.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
